name: build

on:
  push:
    branches: [main, web]
    tags: ["v*"]
  pull_request:
    branches: [main, web]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build EXE
        run: python scripts/build_exe.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiMonitorLightTray-${{ github.ref_name }}
          path: dist/MiMonitorLightTray.exe
          if-no-files-found: error

  release:
    needs: build-exe
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MiMonitorLightTray-${{ github.ref_name }}
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiMonitorLightTray.exe
          generate_release_notes: true
          draft: false
          prerelease: false
