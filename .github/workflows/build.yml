name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build EXE
        run: python scripts/build_exe.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiMonitorLightTray-windows
          path: dist/MiMonitorLightTray.exe
          if-no-files-found: error

  release:
    needs: build-exe
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MiMonitorLightTray-windows
          path: dist
      - name: Pick release notes markdown if present
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"  # e.g. "v1.5.1"
          $path = "release-notes/RELEASE_NOTES_$tag.md"
          $bodyFile = ""
          if (Test-Path $path) {
            $bodyFile = $path
            Write-Output "body_path=$bodyFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Using custom release notes: $bodyFile"
          } else {
            Write-Host "No custom notes at $path, using auto-generated ones."
          }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiMonitorLightTray.exe
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          draft: false
          prerelease: false
